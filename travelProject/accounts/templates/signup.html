{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — TravelLog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <a href="{% url 'home' %}" class="text-decoration-none">
      <div class="auth-logo">Travel<span>Log</span></div>
    </a>
    <p class="auth-subtitle">회원가입하고 나만의 여행 이야기를 기록해보세요.</p>

    {% if error_message %}
    <div class="alert alert-danger rounded-3 small py-2 mb-3" role="alert">
      <i class="bi bi-exclamation-circle me-1"></i>{{ error_message }}
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">아이디</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;border-color:#e2e8f0;">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" name="username" class="form-control border-start-0"
            placeholder="사용할 아이디를 입력하세요" style="border-radius:0 10px 10px 0;border-color:#e2e8f0;">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">비밀번호</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;border-color:#e2e8f0;">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" name="password" class="form-control border-start-0"
            placeholder="비밀번호를 입력하세요" style="border-radius:0 10px 10px 0;border-color:#e2e8f0;">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">비밀번호 확인</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;border-color:#e2e8f0;">
            <i class="bi bi-shield-lock text-muted"></i>
          </span>
          <input type="password" name="repeat" class="form-control border-start-0"
            placeholder="비밀번호를 다시 입력하세요" style="border-radius:0 10px 10px 0;border-color:#e2e8f0;">
        </div>
      </div>
      <button type="submit" class="btn-travel-submit btn">
        <i class="bi bi-person-plus me-1"></i>가입하기
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      이미 계정이 있으신가요?
      <a href="{% url 'accounts:login' %}" class="fw-semibold" style="color:var(--travel-primary);">로그인</a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
