{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — TravelLog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo -->
    <a href="{% url 'home' %}" class="text-decoration-none">
      <div class="auth-logo">Travel<span>Log</span></div>
    </a>
    <p class="auth-subtitle">다시 만나서 반가워요! 로그인하고 여행 이야기를 이어가세요.</p>

    <!-- Error Message -->
    {% if error_message %}
    <div class="alert alert-danger rounded-3 small py-2 mb-3" role="alert">
      <i class="bi bi-exclamation-circle me-1"></i>{{ error_message }}
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">아이디</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;border-color:#e2e8f0;">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" name="username" class="form-control border-start-0"
            placeholder="아이디를 입력해주세요" style="border-radius:0 10px 10px 0;border-color:#e2e8f0;">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">비밀번호</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;border-color:#e2e8f0;">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" name="password" class="form-control border-start-0"
            placeholder="비밀번호를 입력해주세요" style="border-radius:0 10px 10px 0;border-color:#e2e8f0;">
        </div>
      </div>
      <button type="submit" class="btn-travel-submit btn">
        <i class="bi bi-box-arrow-in-right me-1"></i>로그인
      </button>
    </form>

    <!-- Divider -->
    <div class="d-flex align-items-center my-4">
      <hr class="flex-grow-1" style="border-color:#e2e8f0;">
      <span class="px-3 text-muted small">또는</span>
      <hr class="flex-grow-1" style="border-color:#e2e8f0;">
    </div>

    <!-- Google Login -->
    <a href="{% provider_login_url 'google' %}" class="btn-google">
      구글 계정으로 로그인
    </a>

    <!-- Sign up Link -->
    <p class="text-center text-muted small mt-4 mb-0">
      아직 계정이 없으신가요?
      <a href="{% url 'accounts:signup' %}" class="fw-semibold" style="color:var(--travel-primary);">회원가입</a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
